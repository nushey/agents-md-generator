[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agents-md-generator"
version = "0.6.0"
description = "MCP server that analyzes codebases and generates AGENTS.md files"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "mcp>=1.26,<2",
    "pydantic>=2.0.0",
    "tree-sitter>=0.24.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-c-sharp>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/nushey/agents-md-generator"
Source = "https://github.com/nushey/agents-md-generator"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
agents-md-generator = "agents_md_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_md_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
